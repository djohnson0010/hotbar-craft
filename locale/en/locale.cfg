[controls]
hotbar-craft=Craft hovered item

[controls-description]
hotbar-craft=Handcraft what the mouse is over: a hotbar or inventory slot, a building, a ghost or a recipe. With nothing under the mouse, crafts the ghost or item in your hand. Shows what's missing when you can't.

[mod-setting-name]
hotbar-craft-count=Craft count
hotbar-craft-popup-seconds=Missing-ingredients tooltip time
hotbar-craft-hover=Show on hover

[mod-setting-description]
hotbar-craft-count=How many to queue per press. Crafts fewer if you only have ingredients for fewer.
hotbar-craft-popup-seconds=The tooltip goes away when you move the mouse off what you pressed __CONTROL__hotbar-craft__ on. This is a fallback for when the mod can't tell you moved: hide after this many seconds.
hotbar-craft-hover=Pointing at a ghost you can't build shows what's missing, without pressing __CONTROL__hotbar-craft__. Only when you don't carry that item and can't craft it right now.

[hotbar-craft]
recipe-field=Recipe
no-recipe=No handcraft recipe for __1__
cannot-handcraft=Can't handcraft __1__
window-title=__1__ (Recipe)
ingredients=Ingredients:
